[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spepa"
version = "0.1.0"
description = "Self-driven Perpetual Evolutionary Prediction-Correction Agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SPEPA Team"}]
keywords = ["agent", "active-inference", "predictive-coding", "self-evolving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
viz = ["matplotlib>=3.5"]
web = ["flask>=2.0"]

[project.scripts]
spepa = "spepa.cli:main"

[project.urls]
Homepage = "https://github.com/spepa/spepa"

[tool.setuptools.packages.find]
where = ["."]
include = ["spepa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
